<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D3550">
<title>DC · Personas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
:root{
  color-scheme:light;
  /* Piedra fría, verde botella y latón — Durán Carasso */
  --bg:#ECEFF0;          /* gris piedra, sesgo frío */
  --card:#FFFFFF;
  --line:#DCE2E4;
  --line-soft:#E9EDEE;
  --navy:#0E3946;        /* tinta: el petrol del logo Durán Carasso */
  --text:#28363B;
  --sub:#75838A;
  --accent:#12525F;      /* petrol claro para acciones */
  --accent-soft:#E2EAEC;
  --gold:#9C7C3C;        /* latón: solo filetes y marcas */
  --gold-soft:#F2ECE0;
  --green:#2C6B52;--green-soft:#E6EFEA;
  --amber:#9C6F1E;--amber-soft:#F5EEDF;
  --red:#9E3F35;--red-soft:#F5E7E4;
  --border:var(--line);
  --serif:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100vh;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:'Inter',system-ui,sans-serif;font-size:14px;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ══ MARCA ══ */
.wordmark{font-family:var(--serif);color:var(--navy);line-height:.92;font-weight:500;letter-spacing:.5px}
.wordmark span{display:block}
.wordmark.grande{font-size:40px;letter-spacing:1.2px;text-align:center}

/* ══ LANDING ══ */
#login{min-height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 20px;gap:0}
.access{width:100%;max-width:392px;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:0 0 30px;position:relative}
.access:before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent)}
.hero{padding:42px 34px 26px;text-align:center;width:100%}
.hero-brand{display:flex;flex-direction:column;align-items:center;margin-bottom:0}
.hero-brand:after{content:'';display:block;width:24px;height:1px;background:var(--gold);margin:20px auto 0}
.hero-title{font-size:11px;font-weight:500;letter-spacing:2.6px;text-transform:uppercase;color:var(--sub);margin-top:17px}
.hero-title em{display:none}
.hero-hint{font-size:12px;color:var(--sub);margin-top:14px;line-height:1.65}
.lg-wrap{width:100%;padding:0 30px}
.access-foot{text-align:center;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#A3ABA8;margin-top:26px}

.sel-trigger{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:13px 15px;display:flex;align-items:center;gap:13px;cursor:pointer;user-select:none;transition:border-color .15s}
.sel-trigger:hover{border-color:#C6CFCB}
.sel-trigger.open{border-radius:2px 2px 0 0;border-color:var(--accent)}
.sel-label{flex:1;font-size:14px;color:var(--sub);text-align:left}
.sel-arrow{color:#B4B2AC;font-size:12px;transition:transform .2s}
.sel-trigger.open .sel-arrow{transform:rotate(180deg)}
.sel-drop{display:none;background:var(--card);border:1px solid var(--accent);border-top:none;border-radius:0 0 2px 2px;overflow:hidden}
.sel-drop.open{display:block}
.sel-search{padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.sel-search input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:9px 12px;font-size:13px;outline:none}
.sel-search input::placeholder{color:#A9A7A1}
.sel-list{max-height:288px;overflow-y:auto}
.sel-item{display:flex;align-items:center;gap:12px;padding:11px 15px;cursor:pointer;border-bottom:1px solid var(--line-soft);transition:background .12s}
.sel-item:last-child{border:none}
.sel-item:hover{background:var(--bg)}
.sel-name{font-size:14px;color:var(--navy)}
.sel-sub{font-size:11px;color:var(--sub);margin-top:1px}
.ava{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#fff;flex-shrink:0;letter-spacing:.6px}
.ava.sm{width:28px;height:28px;font-size:10px}
.ava.lg{width:56px;height:56px;font-size:17px}

#pinbox{width:100%;padding:0 30px}
#pin_name{font-family:var(--serif);font-size:22px;color:var(--navy);font-weight:500;letter-spacing:.3px}
.pin-dots{display:flex;gap:15px;justify-content:center;margin:26px 0 24px}
.pin-dot{width:11px;height:11px;border-radius:50%;border:1.5px solid #CFCDC7;transition:.15s}
.pin-dot.on{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{aspect-ratio:1.45;background:var(--card);border:1px solid var(--line);border-radius:2px;color:var(--navy);font-size:19px;font-weight:300;cursor:pointer;transition:.12s;font-variant-numeric:tabular-nums}
.pad button:hover{border-color:var(--accent);background:var(--accent);color:#fff}
.pad button:active{opacity:.85}
.pad .fn{background:transparent;border-color:transparent;font-size:15px;color:var(--sub)}
.pad .fn:hover{background:var(--card);border-color:var(--line);color:var(--navy)}
.pin-err{color:var(--red);font-size:12px;text-align:center;min-height:18px;margin-top:16px}

/* ══ SHELL ══ */
#app{display:none;min-height:100vh;flex-direction:column}
#app.on{display:flex}
.topbar{background:var(--card);border-bottom:1px solid var(--line);box-shadow:inset 0 2px 0 var(--accent);padding:13px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:60}
.tb-brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.tb-brand .wordmark{font-size:15px;letter-spacing:.4px}
.tb-brand .et{font-size:7.5px;font-weight:500;letter-spacing:2.2px;color:var(--gold);text-transform:uppercase;font-family:'Inter',sans-serif;align-self:flex-end;padding-bottom:2px}

.tb-spacer{flex:1}
.clockbox{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:4px 4px 4px 16px}
.clock-t{font-family:var(--serif);font-size:17px;font-weight:500;color:var(--navy);letter-spacing:.2px;font-variant-numeric:tabular-nums}
.clock-t small{font-family:'Inter',sans-serif;font-size:11px;color:var(--sub);font-weight:400}
.cbtn{border:1px solid transparent;border-radius:2px;padding:8px 16px;font-size:11.5px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:.14s}
.cbtn:disabled{opacity:.32;cursor:not-allowed}
.cb-in{background:var(--green-soft);color:var(--green);border-color:#CFE5DA}
.cb-in:not(:disabled):hover{background:var(--green);color:#fff}
.cb-pause{background:var(--amber-soft);color:var(--amber);border-color:#EEDFBE}
.cb-pause:not(:disabled):hover{background:var(--amber);color:#fff}
.cb-out{background:var(--red-soft);color:var(--red);border-color:#EFD3CD}
.cb-out:not(:disabled):hover{background:var(--red);color:#fff}
.tb-user{display:flex;align-items:center;gap:9px;cursor:pointer;flex-shrink:0}
.tb-uname{font-size:12.5px;color:var(--navy);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shell{display:flex;flex:1;min-height:0}
.side{width:214px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:57px;align-self:stretch;max-height:calc(100vh - 57px);overflow-y:auto}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:2px;font-size:13px;color:var(--text);cursor:pointer;margin-bottom:1px;border:none;background:none;width:100%;text-align:left;transition:.12s;position:relative;border-left:2px solid transparent}
.nav-i:hover{background:var(--bg)}
.nav-i.on{background:var(--accent-soft);color:var(--accent);font-weight:500;border-left-color:var(--gold)}
.nav-i .ic{width:17px;text-align:center;font-size:13px;opacity:.6}
.nav-i.on .ic{opacity:1}
.nav-i .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:600;border-radius:999px;padding:1px 6px;min-width:18px;text-align:center}
.nav-sep{font-size:8.5px;letter-spacing:1.4px;text-transform:uppercase;color:#ADABA5;padding:18px 11px 6px;font-weight:600}
.nav-sep:first-child{padding-top:2px}
.main{flex:1;min-width:0;padding:26px 30px 90px;max-width:1180px}
.bottomnav{display:none}

@media(max-width:860px){
  .tb-brand .wordmark{font-size:13px}
  .tb-brand .et{display:none}
  .side{display:none}
  .main{padding:16px 14px 96px}
  .topbar{flex-wrap:wrap;gap:9px;padding:10px 14px}
  .tb-user .tb-uname{display:none}
  .clockbox{order:3;width:100%;justify-content:space-between;padding:5px 5px 5px 14px}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:70;padding-bottom:env(safe-area-inset-bottom)}
  .bn-i{flex:1;border:none;background:none;padding:9px 2px 10px;font-size:9.5px;color:#9B9995;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  .bn-i .ic{font-size:15px}
  .bn-i.on{color:var(--accent)}
}

/* ══ TIPOGRAFÍA DE PÁGINA ══ */
.h1{font-family:var(--serif);font-size:34px;font-weight:400;color:var(--navy);margin-bottom:5px;letter-spacing:-.3px;text-wrap:balance;line-height:1.1}
.h1-sub{font-size:13px;color:var(--sub);margin-bottom:26px}
.sec{font-size:9px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--sub);margin:34px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec:first-child{margin-top:0}

/* ══ SUPERFICIES ══ */
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:20px 22px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:720px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.g2.tight{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:18px 20px 17px}
.kpi-n{font-family:var(--serif);font-size:38px;font-weight:400;color:var(--navy);line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi-n.sm{font-size:28px}
.kpi-l{font-size:9.5px;color:var(--sub);text-transform:uppercase;letter-spacing:1.3px;margin-top:11px;font-weight:500}
.kpi-x{font-size:11.5px;color:var(--sub);margin-top:5px}
.pos{color:var(--green)}.neg{color:var(--red)}

/* ══ ELEMENTOS ══ */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;font-weight:500;border-radius:2px;padding:5px 9px;white-space:nowrap;letter-spacing:.7px;text-transform:uppercase}
.p-ok{background:var(--green-soft);color:var(--green)}
.p-warn{background:var(--amber-soft);color:var(--amber)}
.p-err{background:var(--red-soft);color:var(--red)}
.p-info{background:var(--accent-soft);color:var(--accent)}
.p-grey{background:var(--bg);color:var(--sub)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.btn{border:1px solid transparent;border-radius:2px;padding:10px 18px;font-size:12px;font-weight:500;letter-spacing:.5px;cursor:pointer;transition:.14s}
.btn:disabled{opacity:.35;cursor:not-allowed}
.b-pri{background:var(--navy);color:#fff}
.b-pri:not(:disabled):hover{background:#0D171C}
.b-gold{background:var(--accent);color:#fff}
.b-gold:not(:disabled):hover{background:#0B5A50}
.b-ok{background:var(--green);color:#fff}
.b-no{background:var(--card);color:var(--red);border-color:#EFD3CD}
.b-no:hover{background:var(--red);color:#fff}
.b-ghost{background:var(--card);border-color:var(--line);color:var(--sub)}
.b-ghost:not(:disabled):hover{border-color:#D3D1CB;color:var(--navy)}
.b-sm{padding:7px 13px;font-size:11.5px;border-radius:2px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.lbl{font-size:10px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.9px;display:block;margin-bottom:6px}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:10px 13px;outline:none;transition:border-color .14s}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:72px;line-height:1.55}
.empty{text-align:center;padding:46px 18px;color:var(--sub);font-size:13px}
.empty .ic{font-size:22px;opacity:.3;display:block;margin-bottom:10px}
.li{display:flex;align-items:center;gap:13px;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:3px;margin-bottom:5px}
.li-t{font-size:13.5px;font-weight:500;color:var(--navy)}
.li-s{font-size:11.5px;color:var(--sub);margin-top:3px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.tbl th{background:transparent;text-align:left;padding:11px 13px;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--sub);font-weight:600;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 13px;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:none}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* Línea de tiempo de fichajes */
.tl{position:relative;padding-left:20px}
.tl:before{content:'';position:absolute;left:4px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl-i{position:relative;padding:7px 0}
.tl-i:before{content:'';position:absolute;left:-19px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--card);border:1.5px solid var(--accent)}
.tl-i.t-ENTRADA:before{border-color:var(--green);background:var(--green)}
.tl-i.t-SALIDA:before{border-color:var(--red);background:var(--red)}
.tl-i.t-PAUSA_INI:before,.tl-i.t-PAUSA_FIN:before{border-color:var(--amber)}
.tl-h{font-size:13px;font-weight:500;color:var(--navy);font-variant-numeric:tabular-nums}
.tl-s{font-size:11px;color:var(--sub);margin-top:1px}

/* Barras */
.bar-row{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.bar-lbl{font-size:11px;color:var(--sub);width:78px;flex-shrink:0}
.bar-track{flex:1;height:14px;background:var(--bg);border-radius:1px;overflow:hidden;position:relative}
.bar-fill{height:100%;background:var(--accent);border-radius:1px;opacity:.9}
.bar-fill.over{background:var(--gold)}
.bar-goal{position:absolute;top:0;bottom:0;width:1px;background:var(--navy);opacity:.35}
.bar-val{font-size:11.5px;color:var(--navy);font-variant-numeric:tabular-nums;width:58px;text-align:right;flex-shrink:0}

/* Calendario anual */
.cal-year{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 18px}
@media(max-width:900px){.cal-year{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.cal-year{grid-template-columns:1fr}}
.cal-mt{text-align:center;font-size:11px;font-weight:600;color:var(--navy);margin-bottom:9px;text-transform:capitalize;letter-spacing:.3px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:8.5px;color:#BEBCB6;text-align:center;padding-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.cal-d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:10.5px;border-radius:50%;color:var(--text);font-variant-numeric:tabular-nums}
.cal-d.out{color:transparent}
.cal-d.wknd{color:#C4C2BC}
.cal-d.fest{background:var(--bg);color:#A5A39D}
.cal-d.hoy{box-shadow:inset 0 0 0 1.5px var(--navy);font-weight:600}
.cal-d.a-VACACIONES{background:#E8C9C4;color:#7A3229}
.cal-d.a-PENDIENTE{background:#F0E0BC;color:#77551A}
.cal-d.a-PERMISO{background:#C7E4DA;color:#1E5346}
.cal-d.a-BAJA{background:#D5D2E8;color:#3E3768}
.cal-d.a-OTRO{background:#DEDCD6;color:#4A4843}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft)}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(23,36,43,.32);display:none;align-items:flex-end;justify-content:center;z-index:150;backdrop-filter:blur(3px)}
.modal.on{display:flex}
@media(min-width:721px){.modal{align-items:center}}
.mbox{background:var(--card);width:100%;max-width:450px;border-radius:3px 3px 0 0;padding:26px 24px 30px;max-height:92vh;overflow-y:auto;border-top:2px solid var(--accent)}
@media(min-width:721px){.mbox{border-radius:3px}}
.mtitle{font-family:var(--serif);font-size:25px;font-weight:400;color:var(--navy);margin-bottom:5px}
.msub{font-size:12.5px;color:var(--sub);margin-bottom:20px;line-height:1.5}
.fld{margin-bottom:14px}

/* Toast */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(16px);bottom:92px;background:var(--navy);color:#fff;padding:12px 22px;border-radius:2px;font-size:13px;z-index:300;opacity:0;transition:.22s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(23,36,43,.18)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
#toast.ok{background:var(--green)}
.spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--sub);font-size:13px}
.offline-bar{background:var(--amber-soft);color:var(--amber);font-size:11.5px;padding:8px 16px;text-align:center;border-bottom:1px solid #EEDFBE}
</style>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="login">
 <div class="access">
  <div class="hero">
    <div class="hero-brand" id="lg_logo"></div>
    <div class="hero-title">Bienvenido</div>
    <div class="hero-hint" id="lg_hint">Selecciona tu nombre para fichar</div>
  </div>

  <div class="lg-wrap" id="lg_sel">
    <div class="sel-trigger" id="sel_trig">
      <div class="ava" id="sel_ava">··</div>
      <div class="sel-label" id="sel_lbl">Selecciona tu nombre</div>
      <div class="sel-arrow">▾</div>
    </div>
    <div class="sel-drop" id="sel_drop">
      <div class="sel-search"><input id="sel_q" placeholder="Buscar…" autocomplete="off"></div>
      <div class="sel-list" id="sel_list"></div>
    </div>
  </div>

  <div id="pinbox" class="hide">
    <div style="text-align:center">
      <div class="ava lg" id="pin_ava" style="margin:0 auto 12px"></div>
      <div id="pin_name"></div>
      <div style="color:var(--sub);font-size:12px;margin-top:6px">Introduce tu PIN de 4 dígitos</div>
    </div>
    <div class="pin-dots" id="pin_dots"></div>
    <div class="pad" id="pad"></div>
    <div class="pin-err" id="pin_err"></div>
    <div style="text-align:center;margin-top:6px">
      <button class="btn b-ghost b-sm" onclick="volverSelect()">Cambiar de usuario</button>
    </div>
  </div>
 </div>
 <div class="access-foot">Control horario · Grupo Inmobiliario</div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app">
  <div class="topbar">
    <div class="tb-brand" id="tb_logo"></div>
    <div class="tb-spacer"></div>
    <div class="clockbox">
      <div class="clock-t"><span id="ck_hoy">0h 00min</span> <small>/ <span id="ck_live">00:00:00</span></small></div>
      <button class="cbtn cb-in"    id="btn_in"    onclick="fichar('ENTRADA')">Entrar</button>

/* ══ CÁLCULO DE JORNADA ═════════════════════════════════════════════════ */
function minutosDe(evs){
  var total=0, ini=null, pausaIni=null;
  evs.slice().sort(cmpTs).forEach(function(e){
    var d=new Date(e.ts);
    if(e.tipo==='ENTRADA') ini=d;
    else if(e.tipo==='PAUSA_INI') pausaIni=d;
    else if(e.tipo==='PAUSA_FIN' && pausaIni){ total-=(d-pausaIni)/60000; pausaIni=null; }
    else if(e.tipo==='SALIDA' && ini){ total+=(d-ini)/60000; ini=null; }
  });
  return {cerrado:Math.max(0,total), abiertoDesde:ini, pausaDesde:pausaIni};
}
function cmpTs(a,b){ return a.ts<b.ts?-1:(a.ts>b.ts?1:0); }

function minutosHoy(){
  var r=minutosDe(S.fichajesHoy), t=r.cerrado;
  if(r.abiertoDesde && !r.pausaDesde) t += (Date.now()-r.abiertoDesde)/60000;
  else if(r.abiertoDesde && r.pausaDesde) t += (r.pausaDesde-r.abiertoDesde)/60000;
  return Math.max(0,t);
}
function minutosDia(fecha, lista){
  var evs=(lista||S.fichajesRango).filter(function(f){return f.fecha===fecha;});
  return minutosDe(evs).cerrado;
}
function minutosDiaVivo(f){ return f===hoyISO()? minutosHoy() : minutosDia(f); }
function horarioDe(fecha){
  for(var i=0;i<S.turnos.length;i++){
    var t=S.turnos[i];
    if(fecha>=t.desde && fecha<=t.hasta){
      for(var j=0;j<S.horarios.length;j++) if(String(S.horarios[j].horario_id)===String(t.horario_id)) return S.horarios[j];
    }
  }
  return miHorario();
}
function miHorario(){
  var id=String(S.emp.horario_id||'STD');
  for(var i=0;i<S.horarios.length;i++) if(String(S.horarios[i].horario_id)===id) return S.horarios[i];
  return S.horarios[0]||null;
}
function esFestivo(fecha){
  for(var i=0;i<S.festivos.length;i++) if(S.festivos[i].fecha===fecha) return S.festivos[i];
  return null;
}
function minutosTeoricos(fecha){
  var h=horarioDe(fecha); if(!h) return 0;
  if(esFestivo(fecha)) return 0;
  var d=new Date(fecha+'T00:00:00');
  var col=['dom','lun','mar','mie','jue','vie','sab'][d.getDay()];
  var rango=String(h[col]||'').trim();
  if(!rango || rango.indexOf('-')<0) return 0;
  var p=rango.split('-');
  var a=p[0].split(':'), b=p[1].split(':');
  var min=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);
  return Math.max(0, min - Number(h.pausa_min||0));
}
function ausenciaEn(fecha, lista){
  lista = lista || S.ausencias;
  for(var i=0;i<lista.length;i++){
    var a=lista[i];
    if(['APROBADA','PENDIENTE'].indexOf(a.estado)<0) continue;
    if(fecha>=a.desde && fecha<=a.hasta) return a;
  }
  return null;
}
function claseAusencia(a){
  if(a.estado==='PENDIENTE') return 'a-PENDIENTE';
  var t=String(a.tipo).toUpperCase();
  if(t.indexOf('VACAC')>=0) return 'a-VACACIONES';
  if(t.indexOf('BAJA')>=0)  return 'a-BAJA';
  if(t.indexOf('PERMISO')>=0) return 'a-PERMISO';
  return 'a-OTRO';
}

  var e=S.estado;
  $('btn_in').disabled    = e!=='FUERA' && e!=='SIN_FICHAR';
  $('btn_out').disabled   = e==='FUERA' || e==='SIN_FICHAR';
  $('btn_pause').disabled = e==='FUERA' || e==='SIN_FICHAR';
  $('btn_pause').textContent = e==='PAUSA' ? 'Reanudar' : 'Pausa';
  if(S.vista==='portal' && $('portal_estado')) pintarEstadoPortal();
  if(S.vista==='fichajes'){
    var el=$('fi_hoy');
    if(el){
      var m=minutosHoy();
      el.textContent = (S.estado==='TRABAJANDO') ? hhmm(m)+' '+pad(Math.floor((m*60)%60))+'s' : hhmm(m);
    }
    var sem=$('fi_sem'); if(sem) sem.textContent=hhmm(minutosSemanaVista());
  }
}
var _semVista={min:0,teo:0};
function minutosSemanaVista(){ return _semVista.min; }
function togglePausa(){ fichar(S.estado==='PAUSA' ? 'PAUSA_FIN' : 'PAUSA_INI'); }

function fichar(tipo){
  var geo = {dispositivo: navigator.userAgent.indexOf('Mobile')>=0?'Móvil':'Escritorio', modalidad: S.modalidad};
  var lanzar = function(){
    var payload = Object.assign({tipo:tipo}, geo);
    api('fichar', payload).then(function(r){
      if(!r.ok){
        if(r.error==='TRANSICION_INVALIDA'){ toast('Estado no válido: ya estás '+etiquetaEstado(r.estado),'err'); refrescar(); }
        else if(r.error==='FUERA_DE_CENTRO') toast('Estás fuera de un centro de trabajo autorizado','err');
        else toast('No se pudo fichar: '+(r.error||''),'err');
        return;
      }
      S.estado = r.estado;
      for(var i=0;i<S.equipo.length;i++) if(S.equipo[i].nombre===S.emp.nombre){ S.equipo[i].estado=r.estado; S.equipo[i].desde=r.ts; }
      S.fichajesHoy.push({id:r.id, ts:r.ts, fecha:r.fecha, hora:r.hora, tipo:tipo, origen:'APP'});
      toast(mensajeFichaje(tipo)+' · '+r.hora.slice(0,5)+(r.centro?' · '+r.centro:''),'ok');
      pintarReloj(); if(S.vista==='portal'||S.vista==='fichajes') render();
    }).catch(function(){
      colaPush(Object.assign({tipo:tipo},geo));
      toast('Sin conexión · fichaje guardado en cola','err');
    });
  };
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(p){
      geo.lat=p.coords.latitude.toFixed(6); geo.lng=p.coords.longitude.toFixed(6);
      geo.acc=Math.round(p.coords.accuracy); lanzar();
    }, lanzar, {timeout:4000, maximumAge:60000});
  } else lanzar();
}
function mensajeFichaje(t){
  return {ENTRADA:'Entrada registrada',SALIDA:'Salida registrada',PAUSA_INI:'Pausa iniciada',PAUSA_FIN:'Jornada reanudada'}[t]||'Registrado';
}
function etiquetaEstado(e){
  return {TRABAJANDO:'trabajando',PAUSA:'en pausa',FUERA:'fuera',SIN_FICHAR:'sin fichar'}[e]||String(e||'').toLowerCase();
}
function colorEstado(e){
  return {TRABAJANDO:'var(--green)',PAUSA:'var(--gold)',FUERA:'#B9B7B2',SIN_FICHAR:'#D5D3CE'}[e]||'#B9B7B2';
}

function entrarApp(){
  $('login').style.display='none';

  $('tb_name').textContent=S.emp.nombre;

  pintarNav();
  refrescar().then(function(){ setInterval(pintarReloj,1000); pintarReloj(); });
  vaciarCola();

function refrescar(){
  S.cargando=true;
  var lunes=lunesDe(new Date()), año=S.year;
  var desdeRango=fISO(new Date(new Date().getFullYear(),0,1));
  var tareas=[
    api('bootstrap').then(function(r){ if(r.ok){ S.empleados=r.empleados; S.horarios=r.horarios; S.festivos=r.festivos; S.esDir=r.esDireccion; S.centros=r.centros||[]; S.turnos=r.turnos||[]; S.exigirCentro=!!r.exigirCentro;
        S.tiposAusencia=r.tiposAusencia||[]; } }),
    api('misFichajes',{desde:desdeRango,hasta:hoyISO()}).then(function(r){
      if(r.ok){ S.fichajesRango=r.fichajes; S.fichajesHoy=r.fichajes.filter(function(f){return f.fecha===hoyISO();});
                S.estado=r.estado?r.estado.estado:'FUERA'; } }),
    api('misAusencias',{year:año}).then(function(r){ if(r.ok){ S.ausencias=r.ausencias; S.saldo=r.saldo; S.saldos=r.saldos||[]; if(r.tipos) S.tiposAusencia=r.tipos; } }),
    api('estadoEquipo').then(function(r){ if(r.ok) S.equipo=r.equipo; }),
    api('ausenciasEquipo',{year:año}).then(function(r){ if(r.ok) S.ausEquipo=r.ausencias; }),
    api('misTareas',{desde:fISO(lunes),hasta:hoyISO()}).then(function(r){ if(r.ok) S.tareas=r.tareas; }),
    api('misDocumentos').then(function(r){ if(r.ok) S.documentos=r.documentos; }),
    api('publicaciones').then(function(r){ if(r.ok) S.publicaciones=r.publicaciones; })
  ];
  return Promise.all(tareas).then(function(){
    S.pendientes = S.esDir ? S.ausEquipo.filter(function(a){return a.estado==='PENDIENTE';}) : [];
    S.cargando=false; pintarNav(); render(); pintarOffline();
  }).catch(function(e){ S.cargando=false; toast('Error de carga: '+e.message,'err'); });
}

/* ── PORTAL ── */
function vPortal(){
  var lunes=lunesDe(new Date());
  var minSem=0, teoSem=0;
  for(var i=0;i<7;i++){ var d=new Date(lunes); d.setDate(d.getDate()+i); var f=fISO(d);
    if(f>hoyISO()) break; minSem+=minutosDiaVivo(f); teoSem+=minutosTeoricos(f); }
  var mes=hoyISO().slice(0,7), minMes=0, teoMes=0;
  var dias={};
  S.fichajesRango.forEach(function(f){ if(f.fecha.slice(0,7)===mes) dias[f.fecha]=1; });
  if(!dias[hoyISO()] && minutosHoy()>0) dias[hoyISO()]=1;
  Object.keys(dias).forEach(function(f){ minMes+=minutosDiaVivo(f); });
  var d1=new Date(mes+'-01');
  while(fISO(d1).slice(0,7)===mes && fISO(d1)<=hoyISO()){ teoMes+=minutosTeoricos(fISO(d1)); d1.setDate(d1.getDate()+1); }

  var trabajando=S.equipo.filter(function(e){return e.estado==='TRABAJANDO';});
  var pausa=S.equipo.filter(function(e){return e.estado==='PAUSA';});
  var proximas=S.ausencias.filter(function(a){return a.hasta>=hoyISO() && a.estado!=='DENEGADA' && a.estado!=='CANCELADA';})
                          .sort(function(a,b){return a.desde<b.desde?-1:1;}).slice(0,3);
  var sal=S.saldo||{disponibles:0,consumidos:0,totales:0,pendientes:0};

  return cab('Hola, '+S.emp.nombre.split(' ')[0], new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))+
  '<div class="card" id="portal_estado" style="margin-bottom:14px">'+estadoPortalHTML()+'</div>'+
  '<div class="sec">Tu jornada</div>'+
  '<div class="grid g4">'+
    kpi(hhmm(minutosHoy()),'Hoy', teoHint(minutosTeoricos(hoyISO())))+
    kpi(hhmm(minSem),'Esta semana', balHint(minSem-teoSem))+
    kpi(hhmm(minMes),'Este mes', balHint(minMes-teoMes))+
    kpi(sal.disponibles,'Vacaciones', sal.consumidos+' consumidos · '+sal.totales+' totales')+
  '</div>'+
  '<div class="sec">Quién está trabajando ahora</div>'+
  '<div class="card">'+
    (trabajando.length||pausa.length ?
      '<div class="row wrap" style="gap:8px">'+
      trabajando.map(function(e){return chipPersona(e,'var(--green)');}).join('')+
      pausa.map(function(e){return chipPersona(e,'var(--gold)');}).join('')+
      '</div><div style="font-size:11.5px;color:var(--sub);margin-top:12px">'+
      trabajando.length+' trabajando · '+pausa.length+' en pausa · '+
      (S.equipo.length-trabajando.length-pausa.length)+' fuera</div>'
      : '<div style="color:var(--sub);font-size:13px">Nadie ha fichado todavía hoy.</div>')+
  '</div>'+
  '<div class="sec">Tus próximas ausencias</div>'+
  (proximas.length ? proximas.map(filaAusencia).join('') : vacio('No tienes ausencias programadas','☀'))+
  (S.esDir && S.pendientes.length ?
    '<div class="sec">Pendiente de tu validación</div>'+
    '<div class="card" style="border-color:#EEDFBE;background:var(--amber-soft)">'+
      '<b>'+S.pendientes.length+'</b> solicitud(es) esperando respuesta. '+
      '<button class="btn b-gold b-sm" style="margin-left:8px" onclick="ir(\'validaciones\')">Revisar</button></div>' : '');
}

function calendarioAnual(year, listaAus){
  var out='<div class="cal-year">';
  for(var m=0;m<12;m++) out+=calendarioMes(year,m,listaAus);
  return out+'</div>';
}
function calendarioMes(year,m,listaAus){
  var primero=new Date(year,m,1), dias=new Date(year,m+1,0).getDate();
  var offset=(primero.getDay()+6)%7;
  var h='<div class="cal-m"><div class="cal-mt">'+MESES[m]+'</div><div class="cal-g">'+
    DOW.map(function(d){return '<div class="cal-dow">'+d+'</div>';}).join('');
  for(var i=0;i<offset;i++) h+='<div class="cal-d out"></div>';
  for(var d=1;d<=dias;d++){
    var f=year+'-'+pad(m+1)+'-'+pad(d);
    var dow=new Date(year,m,d).getDay();
    var cls='cal-d';
    var a=ausenciaEn(f,listaAus);
    if(a) cls+=' '+claseAusencia(a);
    else if(esFestivo(f)) cls+=' fest';
    else if(dow===0||dow===6) cls+=' wknd';
    if(f===hoyISO()) cls+=' hoy';
    var tit=a?esc(a.tipo)+' ('+a.estado.toLowerCase()+')':(esFestivo(f)?esc(esFestivo(f).nombre):'');
    h+='<div class="'+cls+'"'+(tit?' title="'+tit+'"':'')+'>'+d+'</div>';
  }
  return h+'</div></div>';
}

function pintarArchivo(){
  var f=$('au_file').files[0];
  if(!f) return $('au_file_info').textContent='Certificado médico, parte de baja, etc. Máx. 8 MB.';
  var mb=(f.size/1048576).toFixed(1);
  $('au_file_info').innerHTML = f.size>8*1048576
    ? '<span style="color:var(--red)">'+esc(f.name)+' pesa '+mb+' MB · el máximo son 8 MB</span>'
    : esc(f.name)+' · '+mb+' MB';
}
function leerArchivo(input){
  return new Promise(function(res){
    var f=input.files&&input.files[0];
    if(!f) return res(null);
    if(f.size>8*1048576) return res('GRANDE');
    var fr=new FileReader();
    fr.onload=function(){ res({nombre:f.name,tipoMime:f.type,datos:fr.result}); };
    fr.onerror=function(){ res(null); };
    fr.readAsDataURL(f);
  });
}
function enviarAusencia(){
  var p={tipo:$('au_tipo').value,desde:$('au_d').value,hasta:$('au_h').value,
         medioDia:$('au_medio').checked,motivo:$('au_motivo').value};

  if(p.hasta<p.desde) return toast('El rango de fechas no es válido','err');
  $('au_send').disabled=true; $('au_send').textContent='Enviando…';
  leerArchivo($('au_file')).then(function(j){
    if(j==='GRANDE'){ $('au_send').disabled=false; $('au_send').textContent='Solicitar'; return toast('El archivo supera los 8 MB','err'); }

    if(!j && tipoDef(p.tipo).requiereJustificante){
      $('au_send').disabled=false; $('au_send').textContent='Solicitar';
      return toast('Este tipo de ausencia necesita justificante','err');
    }

      cerrarModal();
      if(r.ok){
        toast('Solicitud enviada · '+r.dias+' día(s)'+(r.arrastre?' ('+r.arrastre+' del año anterior)':''),'ok');

        SOLAPAMIENTO:'Ya tienes una ausencia en esas fechas',
        SIN_DIAS:'No te quedan días suficientes de este tipo ('+(r.disponibles||0)+' disponibles, pides '+(r.solicitados||0)+')',
        JUSTIFICANTE_OBLIGATORIO:'Este tipo de ausencia necesita justificante',
        ARCHIVO_DEMASIADO_GRANDE:'El justificante supera los 8 MB'
      }[r.error]||('Error: '+(r.error||'')),'err');
    });
  });
}

/* ── ESTADÍSTICAS ── */
function vStats(){
  var semanas=[], hoy=new Date();
  for(var w=7;w>=0;w--){
    var l=lunesDe(hoy); l.setDate(l.getDate()-w*7);
    var min=0, teo=0;
    for(var i=0;i<7;i++){ var d=new Date(l); d.setDate(d.getDate()+i); var f=fISO(d);
      if(f>hoyISO()) break; min+=minutosDiaVivo(f); teo+=minutosTeoricos(f); }
    semanas.push({lbl:pad(l.getDate())+' '+MESES[l.getMonth()].slice(0,3), min:min, teo:teo});
  }
  var max=Math.max.apply(null,semanas.map(function(s){return Math.max(s.min,s.teo);}).concat([60]));
  var totalMin=semanas.reduce(function(a,s){return a+s.min;},0);
  var totalTeo=semanas.reduce(function(a,s){return a+s.teo;},0);
  var extras=semanas.reduce(function(a,s){return a+Math.max(0,s.min-s.teo);},0);
  var diasFichados={}; S.fichajesRango.forEach(function(f){diasFichados[f.fecha]=1;});

  return cab('Estadísticas','Tu bolsa de horas y evolución · últimas 8 semanas')+
   '<div class="grid g4" style="margin-bottom:16px">'+

        '<span class="pill '+(o.valoracion>=7?'p-ok':o.valoracion>=5?'p-warn':'p-err')+'">Valorado '+(o.valoracion==null?'—':o.valoracion)+'/10</span>')+
    '</div>'+
    (o.descripcion?'<div style="font-size:12.5px;color:var(--sub);line-height:1.55;margin-bottom:12px">'+esc(o.descripcion)+'</div>':'')+
    '<div class="bar-row" style="margin-bottom:0"><div class="bar-lbl">Progreso</div>'+

            :'<div class="row"><input class="inp" type="number" min="1" max="10" id="ev_n_'+e.id+'" value="'+(e.notaAuto==null?'':e.notaAuto)+'" placeholder="1-10" style="max-width:92px">'+

         '</div>';
       }).join('')+
       (cerrada?'':'<button class="btn b-gold" style="margin-top:16px" onclick="guardarAuto(\''+esc(c).replace(/'/g,"\\'")+'\')">Guardar autoevaluación</button>')+

function guardarAuto(campana){
  var notas={};
  S.evaluacion.filter(function(e){return e.campana===campana;}).forEach(function(e){

  api('autoevaluar',{notas:notas}).then(function(r){
    if(r.ok){ toast('Autoevaluación guardada','ok'); ir('evaluacion'); } else toast('Error','err');
  });
}

  var e=S.encuestas.filter(function(x){return x.id===id;})[0]; if(!e) return;
  abrirModal('<div class="mtitle">'+esc(e.titulo)+'</div>'+

        '<div class="row" style="gap:6px">'+[1,2,3,4,5].map(function(n){
          return '<button class="btn b-ghost b-sm" style="flex:1" data-q="'+i+'" data-v="'+n+'" onclick="marcarEscala(this)">'+n+'</button>';
        }).join('')+'</div><input type="hidden" id="enq_'+i+'"></div>';
      return '<div class="fld"><label class="lbl">'+esc(p.texto)+'</label><textarea class="inp" id="enq_'+i+'"></textarea></div>';

function marcarEscala(btn){
  var q=btn.getAttribute('data-q');
  Array.prototype.forEach.call(document.querySelectorAll('[data-q="'+q+'"]'),function(b){
    b.className='btn b-ghost b-sm'; b.style.flex='1';
  });
  btn.className='btn b-gold b-sm'; btn.style.flex='1';
  $('enq_'+q).value=btn.getAttribute('data-v');
}

  var e=S.encuestas.filter(function(x){return x.id===id;})[0];
  var resp=e.preguntas.map(function(p,i){ return {texto:p.texto,tipo:p.tipo,valor:$('enq_'+i).value}; });
  if(resp.some(function(r){return !r.valor;})) return toast('Responde todas las preguntas','err');
  api('responderEncuesta',{id:id,respuestas:resp}).then(function(r){
    cerrarModal();
    if(r.ok){ toast('Gracias por responder','ok'); ir('encuestas'); }
    else toast(r.error==='YA_RESPONDIDA'?'Ya habías respondido':'Error','err');
  });

function vValidaciones(){
  var pend=S.ausEquipo.filter(function(a){return a.estado==='PENDIENTE';}).sort(function(a,b){return a.desde<b.desde?-1:1;});
  var hist=S.ausEquipo.filter(function(a){return a.estado!=='PENDIENTE';}).sort(function(a,b){return a.ts<b.ts?1:-1;}).slice(0,20);
  return cab('Validaciones','Solicitudes de ausencia del equipo')+
   '<div class="sec">Pendientes ('+pend.length+')</div>'+
   (pend.length? pend.map(function(a){
     return '<div class="card" style="margin-bottom:8px">'+
       '<div class="row" style="margin-bottom:9px"><div class="ava sm">'+esc(ini(a.trabajador))+'</div>'+
       '<div style="flex:1;min-width:0"><div class="li-t">'+esc(a.trabajador)+'</div>'+
       '<div class="li-s">'+esc(a.tipo)+' · '+fBonita(a.desde)+(a.desde!==a.hasta?' → '+fBonita(a.hasta):'')+' · '+a.dias+' d</div></div>'+
       '<span class="pill p-warn">Pendiente</span></div>'+
       (a.motivo?'<div style="font-size:12px;color:var(--sub);background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:9px">'+esc(a.motivo)+'</div>':'')+
       (solapes(a).length?'<div style="font-size:11.5px;color:var(--orange);margin-bottom:9px">⚠ Coincide con: '+solapes(a).map(function(x){return esc(x.trabajador);}).join(', ')+'</div>':'')+
       '<div class="row"><button class="btn b-ok b-sm" style="flex:1" onclick="validar(\''+a.id+'\',\'APROBADA\')">Aprobar</button>'+
       '<button class="btn b-no b-sm" style="flex:1" onclick="validar(\''+a.id+'\',\'DENEGADA\')">Denegar</button></div></div>';
   }).join('') : vacio('No hay solicitudes pendientes','✓'))+
   '<div class="sec">Histórico reciente</div>'+
   (hist.length? '<div class="scroll-x"><table class="tbl"><tr><th>Persona</th><th>Tipo</th><th>Fechas</th><th>Días</th><th>Estado</th><th>Validó</th></tr>'+
     hist.map(function(a){
       return '<tr><td>'+esc(a.trabajador)+'</td><td>'+esc(a.tipo)+'</td><td>'+fBonita(a.desde)+(a.desde!==a.hasta?' → '+fBonita(a.hasta):'')+'</td>'+
         '<td>'+a.dias+'</td><td><span class="pill '+({APROBADA:'p-ok',DENEGADA:'p-err',CANCELADA:'p-grey'}[a.estado]||'p-grey')+'">'+esc(a.estado)+'</span></td>'+
         '<td>'+esc(a.validador||'—')+'</td></tr>';
     }).join('')+'</table></div>' : vacio('Sin histórico','▦'));
}
function solapes(a){
  return S.ausEquipo.filter(function(x){
    return x.id!==a.id && x.estado==='APROBADA' && x.desde<=a.hasta && x.hasta>=a.desde;
  });
}
function validar(id,decision){
  var comentario = decision==='DENEGADA' ? (prompt('Motivo de la denegación (se enviará al empleado):')||'') : '';
  if(decision==='DENEGADA' && !comentario) return;
  api('validarAusencia',{id:id,decision:decision,comentario:comentario}).then(function(r){
    if(r.ok){ toast('Solicitud '+decision.toLowerCase(),'ok'); refrescar(); } else toast('Error: '+(r.error||''),'err');
  });
}

  return cab('Incidencias','Anomalías en el registro de jornada')+

     '<button class="btn b-pri" style="align-self:flex-end" onclick="cargarIncidencias()">Analizar</button>'+

     '<button class="btn b-ghost" style="align-self:flex-end" onclick="comprobarIntegridad()">Verificar integridad</button>'+
   '</div></div><div id="inc_out">'+vacio('Selecciona un rango y pulsa Analizar','⚠')+'</div>';
}
function cargarIncidencias(){
  $('inc_out').innerHTML='<div class="loading"><span class="spinner"></span> Analizando…</div>';
  api('incidencias',{desde:$('inc_d').value,hasta:$('inc_h').value}).then(function(r){
    if(!r.ok) return $('inc_out').innerHTML=vacio('Error al analizar','⚠');
    if(!r.incidencias.length) return $('inc_out').innerHTML=vacio('Sin incidencias en el periodo','✓');
    var et={SIN_SALIDA:'Sin fichaje de salida',JORNADA_LARGA:'Jornada superior a 9 h',JORNADA_CORTA:'Jornada inferior a 1 h'};
    $('inc_out').innerHTML='<div class="scroll-x"><table class="tbl"><tr><th>Persona</th><th>Fecha</th><th>Incidencia</th><th>Detalle</th><th></th></tr>'+
      r.incidencias.map(function(i){
        return '<tr><td>'+esc(i.trabajador)+'</td><td>'+fBonita(i.fecha)+'</td>'+
          '<td><span class="pill '+(i.tipo==='SIN_SALIDA'?'p-err':'p-warn')+'">'+esc(et[i.tipo]||i.tipo)+'</span></td>'+
          '<td>'+esc(i.detalle)+'</td>'+
          '<td><button class="btn b-ghost b-sm" onclick="modalCorregirDir(\''+esc(i.trabajador).replace(/'/g,"\\'")+'\',\''+i.fecha+'\')">Corregir</button></td></tr>';
      }).join('')+'</table></div>';
  });
}
function comprobarIntegridad(){
  toast('Verificando cadena de sellos…');
  api('verificarCadena').then(function(r){
    if(!r.ok) return toast('Error','err');
    if(r.integridad) toast('Integridad correcta · '+r.total+' fichajes verificados','ok');
    else toast('⚠ '+r.rotas.length+' registro(s) alterados fuera de la app','err');
  });
}
function modalCorregirDir(trabajador,fecha){
  abrirModal('<div class="mtitle">Corregir fichaje</div>'+
    '<div class="msub">'+esc(trabajador)+' · '+fBonita(fecha)+'. Se añade un registro nuevo, no se borra nada.</div>'+

    '<div class="fld"><label class="lbl">Tipo</label><select class="inp" id="cd_tipo">'+
      '<option value="SALIDA">Salida</option><option value="ENTRADA">Entrada</option>'+
      '<option value="PAUSA_INI">Inicio de pausa</option><option value="PAUSA_FIN">Fin de pausa</option></select></div>'+
    '<div class="fld"><label class="lbl">Motivo (queda registrado)</label><textarea class="inp" id="cd_motivo" placeholder="Ej.: olvidó fichar la salida, confirmado por el responsable"></textarea></div>'+

}
function guardarCorreccion(trabajador){
  var motivo=$('cd_motivo').value.trim();
  if(!motivo) return toast('El motivo es obligatorio','err');
  api('corregirFichaje',{trabajador:trabajador,ts:new Date($('cd_ts').value).toISOString(),
      tipo:$('cd_tipo').value,motivo:motivo}).then(function(r){
    cerrarModal();
    if(r.ok){ toast('Corrección registrada','ok'); cargarIncidencias(); } else toast('Error: '+(r.error||''),'err');
  });
}

var ultimoInforme=null;
function generarInforme(){
  $('inf_out').innerHTML='<div class="loading"><span class="spinner"></span> Generando…</div>';
  api('informe',{desde:$('inf_d').value,hasta:$('inf_h').value,trabajador:$('inf_p').value}).then(function(r){
    if(!r.ok||!r.fichajes.length) return $('inf_out').innerHTML=vacio('Sin registros en el periodo','⤓');
    ultimoInforme=r.fichajes;
    var porDia={};
    r.fichajes.forEach(function(f){ var k=f.trabajador+'|'+f.fecha; (porDia[k]=porDia[k]||[]).push(f); });
    var filas=Object.keys(porDia).sort().map(function(k){
      var evs=porDia[k].sort(cmpTs), p=k.split('|');
      var m=minutosDe(evs).cerrado;
      var ent=evs.filter(function(e){return e.tipo==='ENTRADA';})[0];
      var sal=evs.filter(function(e){return e.tipo==='SALIDA';}).pop();
      var corr=evs.some(function(e){return e.origen==='CORRECCION';});
      return {trabajador:p[0],fecha:p[1],entrada:ent?String(ent.hora).slice(0,5):'—',
              salida:sal?String(sal.hora).slice(0,5):'—',min:m,corr:corr};
    });
    var total=filas.reduce(function(a,f){return a+f.min;},0);
    $('inf_out').innerHTML=
      '<div class="row wrap" style="margin-bottom:12px"><b>'+filas.length+' jornadas · '+hhmm(total)+' en total</b><div class="sp"></div>'+
      '<button class="btn b-gold b-sm" onclick="exportarCSV()">Descargar CSV</button>'+
      '<button class="btn b-ghost b-sm" onclick="informePDF()">Descargar PDF</button></div>'+
      '<div class="scroll-x"><table class="tbl"><tr><th>Persona</th><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Horas</th><th></th></tr>'+
      filas.map(function(f){
        return '<tr><td>'+esc(f.trabajador)+'</td><td>'+f.fecha+'</td><td>'+f.entrada+'</td><td>'+f.salida+'</td>'+
          '<td style="font-variant-numeric:tabular-nums">'+hhmm(f.min)+'</td>'+
          '<td>'+(f.corr?'<span class="pill p-warn">Corregido</span>':'')+'</td></tr>';
      }).join('')+'</table></div>';
  });
}
function exportarCSV(){
  if(!ultimoInforme) return;
  descargarCSV('registro-jornada-'+$('inf_d').value+'_'+$('inf_h').value+'.csv',
    ['id','fecha','hora','trabajador','tipo','modalidad','centro','origen','motivo','autor'],
    ultimoInforme.map(function(f){
      return [f.id,f.fecha,f.hora,f.trabajador,f.tipo,f.modalidad||'',f.centro||'',
              f.origen||'APP',f.motivo||'',f.autor||''];
    }));
}
/** Abre una hoja limpia lista para «Guardar como PDF» desde el diálogo de impresión. */
function informePDF(){
  if(!ultimoInforme) return;
  var porDia={};
  ultimoInforme.forEach(function(f){ var k=f.trabajador+'|'+f.fecha; (porDia[k]=porDia[k]||[]).push(f); });
  var filas=Object.keys(porDia).sort().map(function(k){
    var evs=porDia[k].sort(cmpTs), p=k.split('|');
    var ent=evs.filter(function(e){return e.tipo==='ENTRADA';})[0];
    var sal=evs.filter(function(e){return e.tipo==='SALIDA';}).pop();
    return {t:p[0],f:p[1],e:ent?String(ent.hora).slice(0,5):'—',s:sal?String(sal.hora).slice(0,5):'—',
            m:minutosDe(evs).cerrado, c:evs.some(function(x){return x.origen==='CORRECCION';})};
  });
  var total=filas.reduce(function(a,f){return a+f.m;},0);
  var w=window.open('','_blank');
  if(!w) return toast('Permite las ventanas emergentes para generar el PDF','err');
  w.document.write('<!doctype html><meta charset="utf-8"><title>Registro de jornada</title>'+
    '<style>body{font-family:Georgia,serif;margin:34px;color:#17242B}'+
    'h1{font-size:20px;letter-spacing:3px;text-transform:uppercase;margin:0 0 4px}'+
    '.s{font-size:11px;color:#666;margin-bottom:22px;font-family:Arial,sans-serif}'+
    'table{width:100%;border-collapse:collapse;font-size:11px;font-family:Arial,sans-serif}'+
    'th{text-align:left;border-bottom:1.5px solid #17242B;padding:7px 6px;font-size:9px;text-transform:uppercase;letter-spacing:1px}'+
    'td{border-bottom:1px solid #E5E5E5;padding:6px}'+
    '.f{margin-top:22px;font-size:10px;color:#666;font-family:Arial,sans-serif;border-top:1px solid #ccc;padding-top:10px}'+
    '@media print{@page{margin:14mm}}</style>'+
    '<h1>Durán Carasso</h1><div class="s">Registro de jornada · '+$('inf_d').value+' a '+$('inf_h').value+
    ($('inf_p').value?' · '+esc($('inf_p').value):' · toda la plantilla')+'</div>'+
    '<table><tr><th>Persona</th><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Horas</th><th>Obs.</th></tr>'+
    filas.map(function(f){
      return '<tr><td>'+esc(f.t)+'</td><td>'+f.f+'</td><td>'+f.e+'</td><td>'+f.s+'</td>'+
        '<td>'+hhmm(f.m)+'</td><td>'+(f.c?'Corregido':'')+'</td></tr>';
    }).join('')+'</table>'+
    '<div class="f"><b>'+filas.length+' jornadas · '+hhmm(total)+' en total.</b><br>'+
    'Registro generado el '+new Date().toLocaleString('es-ES')+' desde DC · Personas. '+
    'Los fichajes son de solo lectura y cada corrección consta con autor y motivo (art. 34.9 ET).</div>');
  w.document.close();
  setTimeout(function(){ w.focus(); w.print(); },400);
}

/* ── Turnos ── */
var turSem=0;
function vTurnos(){
  var lunes=lunesDe(new Date()); lunes.setDate(lunes.getDate()+turSem*7);
  var dias=[]; for(var i=0;i<7;i++){ var d=new Date(lunes); d.setDate(d.getDate()+i); dias.push(fISO(d)); }
  var fin=dias[6];
  return cab('Turnos','Planificación semanal de jornadas del equipo')+
   '<div class="card" style="margin-bottom:14px"><div class="row wrap">'+
     '<button class="btn b-ghost b-sm" onclick="turSem--;render()">←</button>'+

}

function verResultados(id){
  var cont=$('res_'+id);
  cont.innerHTML='<div class="loading"><span class="spinner"></span></div>';
  api('resultadosEncuesta',{id:id}).then(function(r){
    if(!r.ok) return cont.innerHTML='';
    if(!r.total) return cont.innerHTML='<div style="font-size:12.5px;color:var(--sub);margin-top:14px">Sin respuestas todavía.</div>';
    var preg=r.encuesta.preguntas;
    cont.innerHTML='<div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft)">'+
      '<div style="font-size:11.5px;color:var(--sub);margin-bottom:14px">'+r.total+' respuestas</div>'+
      preg.map(function(p,i){
        var vals=r.respuestas.map(function(res){return res[i]?res[i].valor:null;}).filter(Boolean);
        if(p.tipo==='texto'){
          return '<div style="margin-bottom:16px"><div style="font-size:12.5px;font-weight:500;margin-bottom:8px">'+esc(p.texto)+'</div>'+

        }
        var nums=vals.map(Number).filter(function(n){return !isNaN(n);});
        var med=nums.length?nums.reduce(function(a,b){return a+b;},0)/nums.length:0;
        return '<div class="bar-row"><div class="bar-lbl" title="'+esc(p.texto)+'">'+esc(p.texto.slice(0,18))+'</div>'+

      }).join('')+'</div>';
  });

/* ── Analytics ── */
function vAnalytics(){
  var a=S.analytics;
  if(!a) return cab('Analytics','Indicadores de plantilla')+vacio('Sin datos','◱');
  var horas=Object.keys(a.horas).map(function(k){return {n:k,v:a.horas[k]};}).sort(function(x,y){return y.v-x.v;});
  var maxH=Math.max.apply(null,[1].concat(horas.map(function(h){return h.v;})));
  var abs=Object.keys(a.absentismo).map(function(k){return {n:k,v:a.absentismo[k]};}).sort(function(x,y){return y.v-x.v;});
  var maxA=Math.max.apply(null,[1].concat(abs.map(function(x){return x.v;})));
  var proy=Object.keys(a.proyectos).map(function(k){return {n:k,m:a.proyectos[k].minutos,c:a.proyectos[k].coste};})
            .sort(function(x,y){return y.m-x.m;});
  var maxP=Math.max.apply(null,[1].concat(proy.map(function(p){return p.m;})));
  var totalDiasAus=Object.keys(a.diasAusencia).reduce(function(s,k){return s+a.diasAusencia[k];},0);

  return cab('Analytics','Indicadores de plantilla · '+fBonita(a.desde)+' → '+fBonita(a.hasta))+
   '<div class="grid g4" style="margin-bottom:6px">'+
     kpi(a.plantilla,'Plantilla activa','')+
     kpi(hhmm(Object.keys(a.horas).reduce(function(s,k){return s+a.horas[k];},0)),'Horas registradas','')+
     kpi(totalDiasAus,'Días de ausencia','')+
     kpi(Object.keys(a.proyectos).length,'Proyectos activos','')+
   '</div>'+
   '<div class="sec">Horas por persona</div>'+
   '<div class="card">'+horas.map(function(h){
     return '<div class="bar-row"><div class="bar-lbl" title="'+esc(h.n)+'">'+esc(h.n.split(' ')[0])+'</div>'+
       '<div class="bar-track"><div class="bar-fill" style="width:'+(h.v/maxH*100)+'%"></div></div>'+
       '<div class="bar-val">'+hhmm(h.v)+'</div></div>';
   }).join('')+'</div>'+
   '<div class="sec">Absentismo por tipo</div>'+
   '<div class="card">'+(abs.length? abs.map(function(x){
     return '<div class="bar-row"><div class="bar-lbl" title="'+esc(x.n)+'">'+esc(x.n.slice(0,15))+'</div>'+
       '<div class="bar-track"><div class="bar-fill over" style="width:'+(x.v/maxA*100)+'%"></div></div>'+
       '<div class="bar-val">'+x.v+' d</div></div>';
   }).join('') : '<div style="color:var(--sub);font-size:13px">Sin ausencias aprobadas en el periodo.</div>')+'</div>'+
   '<div class="sec">Coste por proyecto</div>'+
   '<div class="card">'+(proy.length? proy.map(function(p){
     return '<div class="bar-row"><div class="bar-lbl" title="'+esc(p.n)+'">'+esc(p.n.slice(0,15))+'</div>'+
       '<div class="bar-track"><div class="bar-fill" style="width:'+(p.m/maxP*100)+'%"></div></div>'+
       '<div class="bar-val">'+(p.c? Math.round(p.c)+' €' : hhmm(p.m))+'</div></div>';
   }).join('')+'<div style="font-size:11px;color:var(--sub);margin-top:12px">El coste sale del campo «coste_hora» de cada persona en la hoja Empleados.</div>'
     : '<div style="color:var(--sub);font-size:13px">Nadie ha imputado tiempo a proyectos.</div>')+'</div>'+
   '<div class="sec">Distribución de la plantilla</div>'+
   '<div class="grid g2">'+
     '<div class="card"><div class="lbl">Por departamento</div>'+repartoHTML(a.porDepartamento)+'</div>'+
     '<div class="card"><div class="lbl">Por oficina</div>'+repartoHTML(a.porOficina)+'</div>'+
   '</div>';
}
function repartoHTML(obj){
  var total=Object.keys(obj).reduce(function(s,k){return s+obj[k];},0)||1;
  return Object.keys(obj).sort(function(a,b){return obj[b]-obj[a];}).map(function(k){
    return '<div class="row" style="padding:7px 0;font-size:12.5px;border-top:1px solid var(--line-soft)">'+
      '<span style="flex:1">'+esc(k)+'</span><span style="color:var(--sub)">'+Math.round(obj[k]/total*100)+'%</span>'+
      '<b style="width:26px;text-align:right">'+obj[k]+'</b></div>';
  }).join('');
}

function capturarUbicacion(){
  if(!navigator.geolocation) return toast('Tu navegador no da ubicación','err');

    $('ce_la').value=p.coords.latitude.toFixed(6);
    $('ce_lo').value=p.coords.longitude.toFixed(6);
    toast('Ubicación capturada · precisión '+Math.round(p.coords.accuracy)+' m','ok');
  },function(){ toast('No se pudo obtener la ubicación','err'); },{enableHighAccuracy:true,timeout:8000});
}

    '<button class="btn b-ghost b-sm" onclick="cerrarQuiosco()">Salir del quiosco</button></div>'+
    '<div id="qk_body"></div></div>';
  document.body.appendChild(ov);

function qkTecla(t){

/* ── Utilidad común de descarga ── */
function descargarCSV(nombre,cabecera,filas){
  var csv=cabecera.join(';')+'\n'+filas.map(function(f){
    return f.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(';');
  }).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=nombre; document.body.appendChild(a); a.click(); a.remove();
}

function demoApiInterno(action,p){

      var e=demoEmp(p.nombre);

      break;
    case 'bootstrap':
      r={ok:true,empleados:db.empleados,horarios:db.horarios,festivos:db.festivos,
         centros:db.centros,exigirCentro:false,tiposAusencia:db.tipos||TIPOS_AUSENCIA_DEF,
         turnos:db.turnos.filter(function(t){return t.trabajador===(yo&&yo.nombre);}),
         esDireccion:yo&&yo.rol==='DIRECCION'}; break;

      var evs=db.fichajes.filter(function(f){return f.trabajador===yo.nombre&&f.fecha===hoyISO();});

      var ok={ENTRADA:est==='FUERA',PAUSA_INI:est==='TRABAJANDO',PAUSA_FIN:est==='PAUSA',SALIDA:est!=='FUERA'}[p.tipo];
      if(!ok){ r={ok:false,error:'TRANSICION_INVALIDA',estado:est}; break; }
      var d=new Date(), reg={id:demoId('F'),ts:d.toISOString(),fecha:hoyISO(),
        hora:pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()),
        trabajador:yo.nombre,tipo:p.tipo,origen:'APP',lat:p.lat||'',lng:p.lng||'',modalidad:p.modalidad||'OFICINA'};
      db.fichajes.push(reg); dbSet(db);
      r={ok:true,id:reg.id,ts:reg.ts,fecha:reg.fecha,hora:reg.hora,
         estado:{ENTRADA:'TRABAJANDO',PAUSA_INI:'PAUSA',PAUSA_FIN:'TRABAJANDO',SALIDA:'FUERA'}[p.tipo]};
      break;
    case 'misFichajes':

      r={ok:true,fichajes:mis,estado:{estado:hoyEv.length?({ENTRADA:'TRABAJANDO',PAUSA_INI:'PAUSA',PAUSA_FIN:'TRABAJANDO',SALIDA:'FUERA'}[hoyEv[hoyEv.length-1].tipo]):'SIN_FICHAR'}};
      break;
    case 'estadoEquipo':
      r={ok:true,equipo:db.empleados.map(function(x){
        var ev=db.fichajes.filter(function(f){return f.trabajador===x.nombre&&f.fecha===hoyISO();});
        return {nombre:x.nombre,departamento:x.departamento,oficina:x.oficina,

      })}; break;
    case 'solicitarAusencia':
      var dias=p.medioDia?0.5:diasLab(p.desde,p.hasta,db.festivos);
      var solapa=db.ausencias.some(function(x){return x.trabajador===yo.nombre&&['PENDIENTE','APROBADA'].indexOf(x.estado)>=0&&p.desde<=x.hasta&&p.hasta>=x.desde;});

      if(defT.requiereJustificante && !p.justificante){ r={ok:false,error:'JUSTIFICANTE_OBLIGATORIO'}; break; }
      var arrUsado=0;
      if(defT.cuentaSaldo){

function demoAudit(db,yo,accion,detalle){
  db.auditoria=db.auditoria||[];
  db.auditoria.push({ts:new Date().toISOString(),actor:(yo&&yo.nombre)||'—',accion:accion,detalle:detalle||''});
}
function demoConsumo(db,nombre,tipo,year,estados){
  var total=0;
  db.ausencias.forEach(function(a){
    if(a.trabajador!==nombre||a.tipo!==tipo) return;
    if(estados.indexOf(a.estado)<0) return;
    var y=Number(String(a.desde).slice(0,4)), arr=Number(a.diasArrastre||0);
    if(y===year) total+=a.dias-arr;
    if(y===year+1) total+=arr;
  });
  return total;
}
function demoSaldos(db,yo,year){
  var tipos=db.tipos||TIPOS_AUSENCIA_DEF;
  var limite=year+'-03-31';
  return tipos.filter(function(t){return t.cuentaSaldo;}).map(function(t){
    var cupo=t.tipo.toUpperCase().indexOf('VACAC')===0? Number(yo.vacaciones_anuales||t.dias) : t.dias;
    var arr=0;
    if(t.arrastrable){
      var gastadoPrev=demoConsumo(db,yo.nombre,t.tipo,year-1,['APROBADA','PENDIENTE']);
      arr=Math.max(0,cupo-gastadoPrev);
    }
    var vigente=hoyISO()<=limite;
    var cons=demoConsumo(db,yo.nombre,t.tipo,year,['APROBADA']);
    var pend=demoConsumo(db,yo.nombre,t.tipo,year,['PENDIENTE']);
    return {tipo:t.tipo,totales:cupo,prorrateado:false,cupoCompleto:cupo,
            arrastre:arr,arrastreVigente:vigente,limiteArrastre:limite,
            consumidos:cons,pendientes:pend,disponibles:cupo+(vigente?arr:0)-cons-pend};
  });
}
function diasLab(d1,d2,fest){
  var f={}; (fest||[]).forEach(function(x){f[x.fecha]=1;});
  var n=0,d=new Date(d1+'T00:00:00'),fin=new Date(d2+'T00:00:00');
  while(d<=fin){ var dw=d.getDay(); if(dw!==0&&dw!==6&&!f[fISO(d)])n++; d.setDate(d.getDate()+1); }
  return n;
}

var promptInstalar=null;

function esIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
function yaInstalada(){
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
}
function instalarApp(){
  if(!promptInstalar) return;
  promptInstalar.prompt();
  promptInstalar.userChoice.then(function(r){
    if(r.outcome==='accepted') toast('App instalada','ok');
    promptInstalar=null; if(S.vista==='perfil') render();
  });
}
function prepararPWA(){
  try{
    if(!document.querySelector('link[rel="manifest"]')){
      var l=document.createElement('link'); l.rel='manifest'; l.href='manifest.json';
      document.head.appendChild(l);
    }
    if(!document.querySelector('meta[name="theme-color"]')){
      var m=document.createElement('meta'); m.name='theme-color'; m.content='#0E3946';
      document.head.appendChild(m);
    }
    // El service worker solo tiene sentido en el dominio propio, no en una vista previa
    if('serviceWorker' in navigator && location.protocol==='https:' && window.top===window.self){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  }catch(e){}
}

function initLogin(){
  pintarPad();
  $('lg_logo').innerHTML=logo('grande');
  $('sel_trig').onclick=function(){ this.classList.toggle('open'); $('sel_drop').classList.toggle('open'); $('sel_q').focus(); };
  $('sel_q').oninput=pintarSelect;
  if(DEMO) $('lg_hint').innerHTML='Modo demo · <b>Admin de pruebas</b> PIN 0000 · <b>Empleado de pruebas</b> PIN 1234'+
    '<br><span style="font-size:11px">Para probar los dos a la vez, abre el segundo en una ventana de incógnito</span>'+
    '<br><a href="#" onclick="reiniciarDemo();return false" style="color:var(--accent);font-size:11px">Reiniciar datos de la demo</a>';
  api('listaEmpleados').then(function(r){
    S.empleados = (r&&r.ok) ? r.empleados : [];
    pintarSelect();
  }).catch(function(){ toast('No se pudo cargar la plantilla','err'); });
}
function reiniciarDemo(){
  if(!confirm('Se borran los datos de prueba de este navegador. ¿Continuar?')) return;
  try{ localStorage.removeItem('dcp_demo'); localStorage.removeItem('dcp_ses'); localStorage.removeItem('dcp_cola'); }catch(e){}
  location.reload();
}
function arrancar(){
  prepararPWA();
  try{ S.modalidad=localStorage.getItem('dcp_mod')||'OFICINA'; }catch(e){}
  var ses=leerSesion();
  if(ses && ses.token){ S.token=ses.token; S.emp=ses.emp; S.esDir=ses.esDir; entrarApp(); }
  else initLogin();
  pintarOffline();
}
document.addEventListener('visibilitychange',function(){
  if(!document.hidden && S.token){ vaciarCola().then(refrescar); }
});
arrancar();
</script>
