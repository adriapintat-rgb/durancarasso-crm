name = "dc-publicador"
main = "worker.js"
compatibility_date = "2024-11-01"

# Cron: cada 5 minutos publica los posts agendados que ya toca
[triggers]
crons = ["*/5 * * * *"]

# Almacenes (crea los IDs con: npx wrangler kv namespace create MEDIA / JOBS)
[[kv_namespaces]]
binding = "MEDIA"
id = "PON_AQUI_EL_ID_DE_MEDIA"

[[kv_namespaces]]
binding = "JOBS"
id = "PON_AQUI_EL_ID_DE_JOBS"

# IG_USER_ID y AI_MODEL no son secretos (van aquí). Los secretos
# (ANTHROPIC_KEY, IG_TOKEN, APP_SECRET) van por `wrangler secret put` (ver README).
[vars]
IG_USER_ID = "PON_AQUI_EL_ID_DE_TU_CUENTA_IG_BUSINESS"
# Modelo de IA. Equilibrio calidad/precio: claude-sonnet-5 ($2/$10 por 1M).
# Ultra-barato: claude-haiku-4-5 ($1/$5). Máxima calidad: claude-opus-5 ($5/$25).
AI_MODEL = "claude-sonnet-5"
