<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--navy:#0D3550;--gold:#B8922A;--bg:#F5F4F1;--card:#fff;--text:#111;--sub:#6B6B6B;--border:#E2E0DB;--green:#1E6B3A;--red:#B03020}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:18px 16px}
header small{display:block;font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.5;margin-bottom:4px}
header h1{font-size:19px;font-weight:600}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.5px;padding:3px 8px;border-radius:20px;background:#EEF4F8;color:var(--navy);margin-right:6px}
.ctx{color:var(--sub);font-size:13px;white-space:pre-wrap;margin-top:10px;border-left:3px solid var(--gold);padding-left:10px}
label{display:block;font-size:13px;font-weight:600;margin:4px 0 6px}
textarea,input{width:100%;font:inherit;border:1px solid var(--border);border-radius:10px;padding:12px;background:#fff}
textarea{min-height:220px;resize:vertical}
.count{font-size:12px;color:var(--sub);text-align:right;margin-top:4px}
.count.over{color:var(--red);font-weight:600}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:14px;cursor:pointer}
.pri{background:var(--green);color:#fff}
.sec{background:#fff;color:var(--red);border:1px solid var(--border)}
.alt{background:#fff;color:var(--navy);border:1px solid var(--border)}
button:disabled{opacity:.5;cursor:wait}
#descarte{display:none;margin-top:10px}
.msg{padding:16px;border-radius:12px;font-weight:500}
.msg.ok{background:#E7F3EC;color:var(--green)}
.msg.ko{background:#FBEAE7;color:var(--red)}
a{color:var(--navy)}
</style>
</head>
<body>
<header><small>Agente Google · Durán Carasso</small><h1 id="h">Propuesta</h1></header>
<main id="app"></main>
<script>
var ERR = <?!= JSON.stringify(error).replace(/</g, '\\u003c') ?>;
var D = <?!= JSON.stringify(d).replace(/</g, '\\u003c') ?>;
var LIM = { POST: 1500, DESCRIPCION: 750, RESPUESTA: 4000 };
var NOMBRE = { POST: 'Publicación', DESCRIPCION: 'Descripción de la ficha', RESPUESTA: 'Respuesta a reseña', TAREA: 'Tarea' };
var app = document.getElementById('app');

function el(tag, attrs, txt) { var e = document.createElement(tag); for (var k in attrs || {}) e.setAttribute(k, attrs[k]); if (txt != null) e.textContent = txt; return e; }
function msg(ok, texto) { var m = el('div', { 'class': 'msg ' + (ok ? 'ok' : 'ko') }, texto); app.innerHTML = ''; app.appendChild(m); return m; }

if (ERR) msg(false, ERR);
else if (D.estado !== 'PENDIENTE' && D.estado !== 'ERROR') msg(true, 'Esta propuesta ya está: ' + D.estado.toLowerCase().replace('_', ' ') + '.');
else render();

function render() {
  document.getElementById('h').textContent = NOMBRE[D.tipo] + ' · ' + D.sede;
  var card = el('div', { 'class': 'card' });
  card.appendChild(el('span', { 'class': 'tag' }, D.sede));
  card.appendChild(el('span', { 'class': 'tag' }, NOMBRE[D.tipo]));
  if (D.titulo) card.appendChild(el('p', { style: 'margin-top:10px;font-weight:600' }, D.titulo));
  if (D.contexto) card.appendChild(el('div', { 'class': 'ctx' }, D.contexto));
  app.appendChild(card);

  var c2 = el('div', { 'class': 'card' });
  c2.appendChild(el('label', { 'for': 'txt' }, D.publicable ? 'Texto (puedes editarlo)' : 'Contenido listo para usar (editable)'));
  var ta = el('textarea', { id: 'txt' }); ta.value = D.texto; c2.appendChild(ta);
  var cnt = el('div', { 'class': 'count' }); c2.appendChild(cnt);
  function upd() { var l = LIM[D.tipo]; cnt.textContent = ta.value.length + (l ? ' / ' + l : '') + ' caracteres'; cnt.className = 'count' + (l && ta.value.length > l ? ' over' : ''); }
  ta.addEventListener('input', upd); upd();

  var b = el('div', { 'class': 'btns' });
  var label = D.publicable ? (D.nivel2 ? '✅ Publicar en Google' : '✅ Aprobar') : '✅ Marcar como hecha';
  var bPub = el('button', { 'class': 'pri' }, label);
  var bDes = el('button', { 'class': 'sec' }, '❌ Descartar');
  b.appendChild(bPub); b.appendChild(bDes); c2.appendChild(b);

  var desc = el('div', { id: 'descarte' });
  desc.appendChild(el('label', { 'for': 'mot' }, '¿Por qué? (opcional, el agente aprende de esto)'));
  var mot = el('input', { id: 'mot', placeholder: 'Ej.: demasiado largo, no usamos emojis, ya está hecho…' });
  desc.appendChild(mot);
  var bConf = el('button', { 'class': 'sec', style: 'margin-top:10px;width:100%' }, 'Confirmar descarte');
  desc.appendChild(bConf); c2.appendChild(desc);
  app.appendChild(c2);

  if (D.accion === 'descartar') { desc.style.display = 'block'; mot.focus(); }

  function run(accion, feedback) {
    if (accion !== 'descartar' && LIM[D.tipo] && ta.value.length > LIM[D.tipo]) { alert('El texto supera el límite de Google.'); return; }
    [bPub, bDes, bConf].forEach(function (x) { x.disabled = true; });
    google.script.run.withSuccessHandler(function (r) {
      var m = msg(r.ok, r.mensaje);
      if (r.manual) {
        var box = el('div', { 'class': 'card', style: 'margin-top:14px' });
        var t2 = el('textarea', { readonly: 'readonly' }); t2.value = r.texto; box.appendChild(t2);
        var cp = el('button', { 'class': 'alt', style: 'width:100%;margin-top:10px' }, '📋 Copiar texto');
        cp.onclick = function () { t2.select(); document.execCommand('copy'); cp.textContent = '✔ Copiado'; };
        box.appendChild(cp);
        var a = el('a', { href: D.panel, target: '_blank', style: 'display:block;text-align:center;margin-top:12px' }, 'Abrir panel de Google Business →');
        box.appendChild(a);
        app.appendChild(box);
      }
    }).withFailureHandler(function (e) { msg(false, 'Error: ' + e.message); })
      .accionWeb(D.id, D.t, accion, ta.value, feedback || '');
  }
  bPub.onclick = function () { run(D.publicable ? 'publicar' : 'hecho'); };
  bDes.onclick = function () { desc.style.display = 'block'; mot.focus(); };
  bConf.onclick = function () { run('descartar', mot.value); };
}
</script>
</body>
</html>
